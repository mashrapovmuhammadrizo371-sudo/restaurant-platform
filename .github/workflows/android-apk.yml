name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --include=dev

      - name: Verify Capacitor CLI
        run: |
          test -f capacitor.config.js
          test ! -f capacitor.config.ts
          ./node_modules/.bin/cap --version
          node -e "import('./capacitor.config.js').then(m => console.log(m.default))"

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: ./node_modules/.bin/cap add android

      - name: Sync Capacitor
        run: ./node_modules/.bin/cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
